name: Bug report
description: Report a reproducible adventure, account, CRUD, UI, or deployment problem
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include route, account/player state, browser/device, and exact steps where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, console output, failing tests, or API responses.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for the issue to be closed?
