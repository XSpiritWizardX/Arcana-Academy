name: Feature request
description: Propose a scoped adventure, content, platform, or developer-experience improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What player or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe the smallest useful implementation and important non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include tests, migrations, docs, and UI evidence where relevant.
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Expected release impact
      options:
        - Patch
        - Minor feature
        - Breaking / major
        - No release impact
