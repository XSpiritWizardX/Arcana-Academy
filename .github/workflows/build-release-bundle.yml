name: Build Release Frontend Bundle

on:
  push:
    branches:
      - release/logd-deploy-readiness
    paths:
      - .github/workflows/build-release-bundle.yml

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/logd-deploy-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci
      - name: Build production frontend bundle
        working-directory: react-vite
        run: npm run build
      - name: Commit generated production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f react-vite/dist
          if git diff --cached --quiet; then
            echo "Production bundle is already current."
            exit 0
          fi
          git commit -m "Build LoGD production frontend bundle"
          git push origin HEAD:release/logd-deploy-readiness
