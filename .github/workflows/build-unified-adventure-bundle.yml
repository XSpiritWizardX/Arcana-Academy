name: Build unified Adventure bundle

on:
  push:
    branches: [feature]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-vite/package-lock.json
      - name: Install frontend dependencies
        working-directory: react-vite
        run: npm ci
      - name: Build production frontend
        working-directory: react-vite
        run: npm run build
      - name: Commit generated bundle if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f react-vite/dist
          if git diff --cached --quiet; then
            echo "Frontend bundle already current."
          else
            git commit -m "Build bundle for unified Adventure UI"
            git push origin HEAD:feature
          fi
